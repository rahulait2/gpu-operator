name: Release Helm Chart

on:
  release:
    types: [created]

permissions: {}

concurrency:
  group: release-helm-chart
  cancel-in-progress: false

jobs:
  publish-helm-chart:
    if: ${{ !github.event.release.prerelease && !contains(github.event.release.tag_name, '-rc') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        name: Check out release tag
        with:
          ref: ${{ github.event.release.tag_name }}
          path: source

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0

      - name: Login to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GH_TOKEN}" | helm registry login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Package Helm chart
        id: package
        working-directory: source
        env:
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          mkdir -p dist
          helm lint deployments/gpu-operator
          helm package \
            --version "${RELEASE_TAG_NAME}" \
            --app-version "${RELEASE_TAG_NAME}" \
            --destination dist \
            deployments/gpu-operator

          CHART_PACKAGE="$(find dist -maxdepth 1 -type f -name 'gpu-operator-*.tgz' | head -n 1)"
          if [[ -z "${CHART_PACKAGE}" ]]; then
            echo "::error::Helm chart package was not created"
            exit 1
          fi

          echo "chart_package=${CHART_PACKAGE}" >> "${GITHUB_OUTPUT}"
          echo "chart_package_name=$(basename "${CHART_PACKAGE}")" >> "${GITHUB_OUTPUT}"

      - name: Publish Helm OCI chart
        working-directory: source
        env:
          GH_REPOSITORY: ${{ github.repository }}
          CHART_PACKAGE: ${{ steps.package.outputs.chart_package }}
        run: |
          set -euo pipefail

          REPOSITORY="$(echo "${GH_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          CHART_REPOSITORY="oci://ghcr.io/${REPOSITORY}/charts"

          helm push "${CHART_PACKAGE}" "${CHART_REPOSITORY}"
          echo "::notice::Published Helm chart to ${CHART_REPOSITORY}"

      - name: Check out Helm repository
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages

      - name: Update GitHub Pages Helm repository
        env:
          CHART_PACKAGE: source/${{ steps.package.outputs.chart_package }}
          CHART_PACKAGE_NAME: ${{ steps.package.outputs.chart_package_name }}
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          REPOSITORY_NAME="${GH_REPOSITORY#*/}"
          OWNER="${GH_REPOSITORY%/*}"
          OWNER_LOWER="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          HELM_REPO_DIR="gh-pages/stable"
          HELM_REPO_URL="https://${OWNER_LOWER}.github.io/${REPOSITORY_NAME}/stable"

          mkdir -p "${HELM_REPO_DIR}"
          cp "${CHART_PACKAGE}" "${HELM_REPO_DIR}/${CHART_PACKAGE_NAME}"
          if [[ -f "${HELM_REPO_DIR}/index.yaml" ]]; then
            helm repo index "${HELM_REPO_DIR}" --url "${HELM_REPO_URL}" --merge "${HELM_REPO_DIR}/index.yaml"
          else
            helm repo index "${HELM_REPO_DIR}" --url "${HELM_REPO_URL}"
          fi

          git -C gh-pages config user.name "github-actions[bot]"
          git -C gh-pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C gh-pages add "stable/${CHART_PACKAGE_NAME}" stable/index.yaml

          if git -C gh-pages diff --cached --quiet; then
            echo "::notice::No GitHub Pages Helm repository changes to publish."
            exit 0
          fi

          git -C gh-pages commit -m "Publish gpu-operator Helm chart ${RELEASE_TAG_NAME}"
          git -C gh-pages push origin gh-pages
